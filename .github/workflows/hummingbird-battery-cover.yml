name: Generate Hummingbird Battery Cover STLs
on:
  push:
    branches: [main]
    paths:
      - "public/downloads/Hummingbird_Battery_Cover_V23.py"
      - ".github/workflows/hummingbird-battery-cover.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CAD tools
        run: python -m pip install cadquery trimesh
      - name: Generate both STL files
        run: python public/downloads/Hummingbird_Battery_Cover_V23.py
      - name: Commit generated STL downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Hummingbird_Battery_Cover_V23A_Inner_Face_Tabs.stl public/downloads/Hummingbird_Battery_Cover_V23B_Inner_Face_Tabs.stl
          if ! git diff --cached --quiet; then
            git commit -m "Generate Hummingbird V23 printable STL downloads"
            git push
          fi
